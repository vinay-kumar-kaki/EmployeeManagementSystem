<div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-5 col-xl-4">
      <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex mb-3">
            <i class="bi bi-shield-lock-fill fs-2"></i>
          </div>
          <h3 class="fw-bold text-dark">EMS Portal</h3>
          <p class="text-muted small">Employee & Leave Management System</p>
        </div>

        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show small" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          {{ errorMessage }}
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          
          <!-- Email Input -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-envelope text-muted"></i>
              </span>
              <input
                type="email"
                formControlName="email"
                class="form-control bg-light border-start-0"
                placeholder="name@company.com"
                [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
              />
            </div>
            <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger small mt-1">
              Please enter a valid corporate email.
            </div>
          </div>

          <!-- Password Input -->
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="bi bi-lock text-muted"></i>
              </span>
              <input
                type="password"
                formControlName="password"
                class="form-control bg-light border-start-0"
                placeholder="••••••••"
                [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
              />
            </div>
            <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
              Password is required (min 6 characters).
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-grid gap-2 d-sm-flex mb-3">
            <button
              type="submit"
              class="btn btn-primary flex-fill py-2 fw-semibold rounded-3 shadow-sm"
              [disabled]="isLoading"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              {{ isLoading ? 'Signing In...' : 'Sign In' }}
            </button>
            <a routerLink="/register" class="btn btn-outline-primary flex-fill py-2 fw-semibold rounded-3">
              <i class="bi bi-person-plus me-1"></i> Register
            </a>
          </div>
        </form>

        <!-- Quick Demo Autofill Links for testing -->
        <div class="border-top pt-3 mt-2 text-center">
          <span class="text-muted extra-small d-block mb-2">Quick Demo Credentials:</span>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillDemoCredentials('admin')">
              <i class="bi bi-person-gear me-1"></i> Admin
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="fillDemoCredentials('employee')">
              <i class="bi bi-person me-1"></i> Employee
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
