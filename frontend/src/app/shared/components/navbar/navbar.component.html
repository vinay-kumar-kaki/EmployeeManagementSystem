<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm px-3" *ngIf="authService.isAuthenticated()">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" routerLink="/dashboard">
      <i class="bi bi-people-fill text-primary fs-4"></i>
      <span>EMS Portal</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </a>
        </li>

        <!-- Admin Only Links -->
        <ng-container *ngIf="authService.hasRole('Admin')">
          <li class="nav-item">
            <a class="nav-link" routerLink="/employees" routerLinkActive="active">
              <i class="bi bi-person-lines-fill me-1"></i> Employees
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/departments" routerLinkActive="active">
              <i class="bi bi-building me-1"></i> Departments
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/leaves/review" routerLinkActive="active">
              <i class="bi bi-check2-circle me-1"></i> Review Leaves
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/attendance/log" routerLinkActive="active">
              <i class="bi bi-clipboard-check me-1"></i> Attendance Log
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/leave-types" routerLinkActive="active">
              <i class="bi bi-tags me-1"></i> Leave Types
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/admin/register" routerLinkActive="active">
              <i class="bi bi-person-plus me-1"></i> Add Admin
            </a>
          </li>
        </ng-container>

        <!-- Employee Links -->
        <ng-container *ngIf="!authService.hasRole('Admin')">
          <li class="nav-item">
            <a class="nav-link" routerLink="/leaves/apply" routerLinkActive="active">
              <i class="bi bi-calendar-plus me-1"></i> Apply Leave
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/leaves/history" routerLinkActive="active">
              <i class="bi bi-clock-history me-1"></i> Leave History
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/attendance" routerLinkActive="active">
              <i class="bi bi-fingerprint me-1"></i> Attendance
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" routerLinkActive="active">
              <i class="bi bi-person-badge me-1"></i> My Profile
            </a>
          </li>
        </ng-container>
      </ul>

      <!-- User Info & Logout -->
      <div class="d-flex align-items-center gap-3" *ngIf="currentUser$ | async as user">
        <div class="text-light text-end d-none d-md-block">
          <div class="fw-semibold small">{{ user.fullName || user.email }}</div>
          <span class="badge" [ngClass]="user.role === 'Admin' ? 'bg-danger' : 'bg-primary'">
            {{ user.role }}
          </span>
        </div>
        <button class="btn btn-outline-danger btn-sm" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </div>
    </div>
  </div>
</nav>
